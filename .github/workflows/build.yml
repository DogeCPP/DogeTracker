name: Build DogeTracker

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      xplane_version:
        description: 'X-Plane version (11 or 12)'
        required: true
        default: '12'

env:
  XPLANE_VERSION: ${{ github.event.inputs.xplane_version || '12' }}
  # The X-Plane SDK is vendored in the repo at XPSDK/SDK — no download needed.
  SDK_PATH: XPSDK/SDK

jobs:

  # ─────────────────────────────────────────────────────────────────────
  #  macOS — universal binary (arm64 + x86_64)
  # ─────────────────────────────────────────────────────────────────────
  build-mac:
    name: macOS Universal
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=toolchain-mac.cmake \
            -DXPLANE_SDK_PATH="${{ github.workspace }}/${SDK_PATH}" \
            -DXPLANE_VERSION=${{ env.XPLANE_VERSION }} \
            -Bbuild/mac .

      - name: Build
        run: cmake --build build/mac -j$(sysctl -n hw.logicalcpu)

      - name: Collect artifact
        run: |
          mkdir -p dist/mac_x64
          cp build/mac/mac_x64/DogeTracker.xpl dist/mac_x64/DogeTracker.xpl

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogetracker-mac
          path: dist/mac_x64/DogeTracker.xpl
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  #  Windows — x86_64, cross-compiled from Linux via MinGW-w64 (posix)
  # ─────────────────────────────────────────────────────────────────────
  build-win:
    name: Windows x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix

      - name: Configure
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=toolchain-mingw64.cmake \
            -DXPLANE_SDK_PATH="${{ github.workspace }}/${SDK_PATH}" \
            -DXPLANE_VERSION=${{ env.XPLANE_VERSION }} \
            -Bbuild/win .

      - name: Build
        run: cmake --build build/win -j$(nproc)

      - name: Collect artifact
        run: |
          mkdir -p dist/win_x64
          cp build/win/win_x64/DogeTracker.xpl dist/win_x64/DogeTracker.xpl

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogetracker-win
          path: dist/win_x64/DogeTracker.xpl
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  #  Linux — x86_64
  # ─────────────────────────────────────────────────────────────────────
  build-lin:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libgl-dev pkg-config

      - name: Configure
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=toolchain-lin.cmake \
            -DXPLANE_SDK_PATH="${{ github.workspace }}/${SDK_PATH}" \
            -DXPLANE_VERSION=${{ env.XPLANE_VERSION }} \
            -Bbuild/lin .

      - name: Build
        run: cmake --build build/lin -j$(nproc)

      - name: Collect artifact
        run: |
          mkdir -p dist/lin_x64
          cp build/lin/lin_x64/DogeTracker.xpl dist/lin_x64/DogeTracker.xpl

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogetracker-lin
          path: dist/lin_x64/DogeTracker.xpl
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  #  Package — assemble a ready-to-install plugin folder for all 3 OSes
  # ─────────────────────────────────────────────────────────────────────
  package:
    name: Package Release
    runs-on: ubuntu-latest
    needs: [ build-mac, build-win, build-lin ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release zip
        run: |
          VERSION=$(grep '#define VERSION ' src/include/config.h | cut -d '"' -f2)
          PLUGIN=release/DogeTracker
          mkdir -p "$PLUGIN/mac_x64" "$PLUGIN/win_x64" "$PLUGIN/lin_x64"

          cp artifacts/dogetracker-mac/DogeTracker.xpl "$PLUGIN/mac_x64/"
          cp artifacts/dogetracker-win/DogeTracker.xpl "$PLUGIN/win_x64/"
          cp artifacts/dogetracker-lin/DogeTracker.xpl "$PLUGIN/lin_x64/"

          # The plugin serves its UI from web/ and reads config.json — both
          # must sit next to the platform folders inside the plugin directory.
          cp -r web "$PLUGIN/web"
          cp config.json "$PLUGIN/config.json"
          [ -d assets ] && cp -r assets "$PLUGIN/assets" || true
          cp README.md LICENSE "$PLUGIN/" || true

          cd release
          zip -rq "dogetracker-${VERSION}-XP${{ env.XPLANE_VERSION }}.zip" DogeTracker
          echo "RELEASE_FILE=release/dogetracker-${VERSION}-XP${{ env.XPLANE_VERSION }}.zip" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: dogetracker-all-platforms
          path: ${{ env.RELEASE_FILE }}
          retention-days: 90

      # Auto-create a GitHub Release when pushing a version tag (e.g. v1.0.2)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_FILE }}
          name: DogeTracker ${{ env.VERSION }}
          body: |
            ## DogeTracker ${{ env.VERSION }}

            Built for X-Plane ${{ env.XPLANE_VERSION }} — Windows, macOS, and Linux.

            ### Installation
            1. Download and extract the zip.
            2. Copy the whole `DogeTracker/` folder into `X-Plane/Resources/plugins/`.
            3. Start X-Plane, load a flight, and open `http://127.0.0.1:4000` in a browser.
            4. To change the port, edit `config.json` (the `port` value) before launching.
